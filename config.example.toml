# 通用设置

# 是否发送各平台封面图片和封面卡片，不影响正文图片。
send_cover_images = true

# HTTP/HTTPS 代理地址；留空使用系统网络设置。
http_proxy = ""

# VideoSegment 发送 URI 协议：0 = Base64，1 = File（默认），2 = Http。
file_protocol = 1

# 单个视频最大下载大小，单位 MB。
max_video_download_megabytes = 1024

# 静图视频编码及不支持的媒体回退所用 ffmpeg；同时需要同目录或 PATH 中有 ffprobe。
ffmpeg_path = ""

# 选择视频流时优先更高帧率。
prefer_high_fps = true

# 优先视频编码：0 = H265，1 = H264，2 = AV1。
preferred_video_codec = 0

# 网络请求超时时间，单位秒。
request_timeout_seconds = 15

# 回复解析结果时是否引用原消息。
quote_reply = false

# 是否下载并发送 VideoSegment。关闭后只发送解析文本或卡片。
send_video_segment = true

# 是否上传视频为群/私聊文件。
upload_video_as_file = false

# 仅当 VideoSegment 发送失败时才上传视频文件。
upload_video_as_file_only_on_video_send_failure = true

# 视频发送完成后是否清理插件 tmp 目录中的本地视频。
delete_local_video_after_send = true

# 发送完成后延迟多少秒删除本地视频。0 表示立即删除。
delete_local_video_delay_seconds = 0

# 视频超过大小限制时是否自动降级尝试较低画质。
auto_fallback_quality_by_size = true

# 是否在日志中输出选择到的视频清晰度与编码信息。
log_selected_quality_info = true

# 是否记录视频下载进度日志。
log_download_progress = true

# 并行下载线程数：0 使用 LightDl 默认值，1–64 使用指定线程数。
parallel_download_threads = 0

# 是否将抖音图文音乐和网易云音乐编码为 Silk；关闭后直接尝试发送 MP3 语音。
enable_silk_encoding = true

# 抖音

# 是否自动解析聊天中的抖音链接。
auto_parse_douyin_links = true

# 是否发送抖音作品封面卡片。
send_douyin_cover = true

# 解析抖音作品时是否获取并发送热门评论。需要有效的抖音 Cookie，接口失败不会影响作品发送。
douyin_fetch_comments = true

# 抖音作品最多获取的热门评论数量。
douyin_comment_count = 10

# Bilibili

# 是否自动解析聊天中的 Bilibili 链接。
auto_parse_bilibili_links = true

# 是否发送 Bilibili 视频、番剧、分 P 和直播封面。
send_bilibili_video_cover = true

# Bilibili 分 P 总览最多展示封面数量。
bilibili_multi_page_cover_image_limit = 50

# 解析 Bilibili 直播时是否尝试发送短回溯片段。
send_bilibili_live_replay_clip = true

# Bilibili 直播短回溯片段时长，单位秒。
bilibili_live_replay_clip_seconds = 30

# Bilibili 直播短回溯片段最大下载大小，单位 MB。
bilibili_live_replay_clip_max_megabytes = 256

# 网易云音乐

# 是否启用网易云音乐解析。关闭后网易云链接解析和 #wyy 搜索均不可用。
enable_net_ease_cloud_music = true

# 是否自动解析聊天中的网易云音乐歌曲链接。
auto_parse_net_ease_cloud_music_links = true

# 解析网易云音乐时是否发送歌曲介绍卡片。
send_net_ease_cloud_music_intro_card = true

# 解析网易云音乐时是否发送歌词卡片。
send_net_ease_cloud_music_lyric_card = true

# 发送网易云音乐语音时是否额外发送手机高音质版。关闭时默认只发送电脑兼容版。
send_net_ease_mobile_best_record = false

# 小黑盒

# 是否启用小黑盒解析。关闭后小黑盒链接解析不可用。
enable_heybox = true

# 是否自动解析聊天中的小黑盒链接。
auto_parse_heybox_links = true

# 是否发送小黑盒封面。
send_heybox_cover = true

# 微信视频号

# 是否自动解析聊天中的微信视频号链接。
auto_parse_weixin_channels_links = true

# 是否发送微信视频号封面卡片。
send_weixin_channels_cover = true

# YouTube

# 是否自动解析聊天中的 YouTube 视频链接。
auto_parse_you_tube_links = true

# 开启后仅允许机器人 Owner/Admin 发送的 YouTube 链接触发解析，群聊和私聊均生效。
you_tube_admin_only = true

# 是否发送 YouTube 视频封面。
send_you_tube_cover = true
