name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MyParser plugin
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MyParser.sln

      - name: Publish plugin
        run: dotnet publish MyParser/Shirobot.Plugin.MyParser.csproj --configuration Release --no-restore -p:CopyPluginToHost=false --output artifact/Shirobot.Plugin.MyParser -v:minimal

      - name: Collect plugin layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageRoot = Join-Path $PWD "artifact/Shirobot.Plugin.MyParser"

          $required = @(
            (Join-Path $packageRoot "Shirobot.Plugin.MyParser.dll")
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing expected package file: $path" }
          }

          $pluginAssembly = Join-Path $packageRoot "Shirobot.Plugin.MyParser.dll"
          $assemblyName = [Reflection.AssemblyName]::GetAssemblyName($pluginAssembly).Name
          if ($assemblyName -ne "Shirobot.Plugin.MyParser") {
            throw "Unexpected plugin assembly name: $assemblyName"
          }

          $dlls = @(Get-ChildItem $packageRoot -Recurse -File -Filter "*.dll")
          if ($dlls.Count -ne 1 -or $dlls[0].Name -ne "Shirobot.Plugin.MyParser.dll") {
            throw "The deployment package must contain only the merged plugin DLL. Found: $($dlls.Name -join ', ')"
          }

          $sharedAssets = @(Get-ChildItem $packageRoot -Recurse -File | Where-Object {
            $_.Name -match '^(ShiroBot\.(SDK|Model\.)|Avalonia|SkiaSharp|HarfBuzzSharp|MicroCom).*'
          })
          if ($sharedAssets.Count -ne 0) {
            throw "Host shared assemblies must not be deployed: $($sharedAssets.Name -join ', ')"
          }

          Get-ChildItem $packageRoot -Recurse -File | Select-Object FullName, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Shirobot.Plugin.MyParser
          if-no-files-found: error
          path: artifact/Shirobot.Plugin.MyParser/**
