name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish release package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MyParser.sln

      - name: Publish plugin
        run: dotnet publish MyParser/Shirobot.Plugin.MyParser.csproj --configuration Release --no-restore -p:CopyPluginToHost=false --output release/Shirobot.Plugin.MyParser -v:minimal

      - name: Collect release package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageRoot = Join-Path $PWD "release/Shirobot.Plugin.MyParser"

          New-Item -ItemType Directory -Force -Path (Join-Path $packageRoot "cookies") | Out-Null
          foreach ($cookie in @("bilibili.txt", "douyin.txt", "xiaohongshu.txt", "netease.txt", "heybox.txt", "weixinchannels-yuanbao.txt")) {
            New-Item -ItemType File -Force -Path (Join-Path $packageRoot "cookies/$cookie") | Out-Null
          }

          $required = @(
            (Join-Path $packageRoot "Shirobot.Plugin.MyParser.dll")
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing expected release package file: $path" }
          }

          Compress-Archive -Path $packageRoot -DestinationPath "release/Shirobot.Plugin.MyParser.zip" -Force
          Get-ChildItem release -Recurse -File | Select-Object FullName, Length

      - name: Upload package to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release/Shirobot.Plugin.MyParser.zip
